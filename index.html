<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusSetup - Správa aktualizací map</title>
    <style>
        :root {
            --bg-color: #121824;
            --panel-bg: #1e2640;
            --accent-color: #0078d4;
            --accent-hover: #005a9e;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --success: #107c41;
            --warning: #ffb900;
            --danger: #f3565d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        /* --- LOGIN --- */
        .login-container { background-color: var(--panel-bg); padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; border-top: 4px solid var(--accent-color); }
        .login-container h2 { margin-bottom: 10px; }
        .login-container p { color: var(--text-muted); margin-bottom: 25px; font-size: 0.9rem; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); }
        .form-group input, .admin-panel input, .admin-panel select { width: 100%; padding: 12px; background-color: #121824; border: 1px solid #3a4566; border-radius: 6px; color: white; font-size: 1rem; outline: none; }
        .form-group input:focus { border-color: var(--accent-color); }
        .btn { width: 100%; padding: 12px; background-color: var(--accent-color); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn:hover { background-color: var(--accent-hover); }
        .error-msg { color: var(--danger); font-size: 0.9rem; margin-top: 15px; display: none; }

        /* --- ROZHRANÍ --- */
        .app-container { display: none; width: 100%; max-width: 1300px; background-color: var(--panel-bg); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); overflow: hidden; }
        .navbar { background-color: #161b2c; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3454; }
        .brand { font-size: 1.3rem; font-weight: bold; }
        .brand span { color: var(--accent-color); }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .logout-btn { background: none; border: 1px solid #4f5d83; color: var(--text-muted); padding: 5px 12px; border-radius: 4px; cursor: pointer; }
        .logout-btn:hover { color: white; border-color: white; }

        .main-content { display: grid; grid-template-columns: 1.5fr 2.5fr; gap: 20px; padding: 25px; }
        @media (max-width: 1024px) { .main-content { grid-template-columns: 1fr; } }

        .section-title { font-size: 1.1rem; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #2a3454; display: flex; justify-content: space-between; align-items: center; }
        
        /* Mapy */
        .maps-grid { display: flex; flex-direction: column; gap: 12px; }
        .map-card { background-color: #161b2c; border: 1px solid #2a3454; border-radius: 8px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .map-card:hover { border-color: var(--accent-color); background-color: #1d253d; }
        .map-details h3 { font-size: 1rem; display: flex; align-items: center; gap: 8px; }
        .map-details p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        .tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .tag-real { background-color: var(--success); }
        .tag-fic { background-color: #7a1fa2; }
        
        .open-btn { background-color: var(--accent-color); color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .open-btn:hover { background-color: var(--accent-hover); }

        /* Sloupce panelů (3 vedle sebe v pravé části) */
        .dashboard-panels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        @media (max-width: 768px) { .dashboard-panels { grid-template-columns: 1fr; } }
        
        .feed-box { background-color: #161b2c; border: 1px solid #2a3454; border-radius: 8px; padding: 15px; min-height: 350px; content-visibility: auto; }
        .feed-item { padding-left: 10px; margin-bottom: 15px; position: relative; border-left: 3px solid #ccc; }
        .feed-item h4 { font-size: 0.9rem; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }
        .feed-item p { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; }
        .feed-date { font-size: 0.7rem; font-weight: bold; display: block; margin-bottom: 2px; }
        
        .type-oznameni { border-left-color: var(--accent-color); }
        .type-vyluky { border-left-color: var(--danger); }
        .type-aktuality { border-left-color: var(--warning); }
        .type-oznameni .feed-date { color: var(--accent-color); }
        .type-vyluky .feed-date { color: var(--danger); }
        .type-aktuality .feed-date { color: var(--warning); }

        .delete-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.85rem; }

        /* Detail Mapy */
        .map-detail-header { background-color: #161b2c; border: 1px solid #2a3454; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background-color: #4f5d83; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px; }

        /* Admin Panel */
        .admin-panel { grid-column: span 2; background-color: #161b2c; border: 1px solid #3a4566; border-radius: 8px; padding: 20px; margin-top: 5px; }
        @media (max-width: 1024px) { .admin-panel { grid-column: span 1; } }
        .admin-grid { display: grid; grid-template-columns: 1fr 120px 1.5fr 2fr auto; gap: 15px; align-items: end; }
        @media (max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- PŘIHLÁŠENÍ -->
    <div class="login-container" id="loginForm">
        <h2>Palubní Terminál</h2>
        <p>Pro přístup zadejte své údaje</p>
        <div class="form-group">
            <label>Řidič</label>
            <input type="text" id="username" placeholder="Petr Šmatlák" autocomplete="off">
        </div>
        <div class="form-group">
            <label>Služební PIN</label>
            <input type="password" id="pin" placeholder="•••••">
        </div>
        <button class="btn" onclick="validateLogin()">Přihlásit se</button>
        <div class="error-msg" id="loginError">Nesprávné údaje.</div>
    </div>

    <!-- HLAVNÍ ROZHRANÍ -->
    <div class="app-container" id="appInterface">
        <nav class="navbar">
            <div class="brand">BUS<span>SETUP</span> Dispečink</div>
            <div class="user-info">
                <span>Řidič: <strong>Petr Šmatlák</strong></span>
                <button class="logout-btn" onclick="logout()">Odhlásit</button>
            </div>
        </nav>

        <div class="main-content">
            
            <!-- LEVÝ SLOUPEC: SEZNAM MAP -->
            <div>
                <div class="section-title">Navigace / Výběr mapy</div>
                <div class="maps-grid" id="mapsList">
                    <!-- Generováno JavaScriptem pro detekci kliknutí na celou kartu -->
                </div>
            </div>

            <!-- PRAVÝ SLOUPEC: DYNAMICKÝ OBSAH (Globální nebo Detail Mapy) -->
            <div>
                <!-- OBSAH OBSAHUJE INSTRUKCE PRO PŘEPÍNÁNÍ -->
                <div id="dynamicContentZone">
                    <!-- Zde se střídá Globální přehled a Detail mapy -->
                </div>
            </div>

            <!-- ADMIN PANEL -->
            <div class="admin-panel">
                <div style="font-size: 1rem; font-weight: bold; margin-bottom: 15px; color: var(--accent-color);" id="adminTitle">✍️ Přidat záznam na globální nástěnku</div>
                <div class="admin-grid">
                    <div>
                        <label style="font-size: 0.8rem; color: var(--text-muted);">Sekce</label>
                        <select id="postType">
                            <option value="oznameni">Oznámení</option>
                            <option value="vyluky">Výluka</option>
                            <option value="aktuality">Aktualita</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 0.8rem; color: var(--text-muted);">Časový štítek</label>
                        <input type="text" id="postDateTag" placeholder="DNES / VČERA / Datum">
                    </div>
                    <div>
                        <label style="font-size: 0.8rem; color: var(--text-muted);">Titulek</label>
                        <input type="text" id="postTitle" placeholder="Název události...">
                    </div>
                    <div>
                        <label style="font-size: 0.8rem; color: var(--text-muted);">Obsah zprávy</label>
                        <input type="text" id="postText" placeholder="Podrobnosti...">
                    </div>
                    <button class="btn" onclick="addPost()" style="padding: 12px 20px;">Publikovat</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Definice všech map
        const mapsData = [
            { id: 'opava15', name: 'Opava a okolí 15km včetně DPO', type: 'real', desc: 'v2.1 | 420 MB' },
            { id: 'opava', name: 'Opava', type: 'real', desc: 'v1.8 | 180 MB' },
            { id: 'ostrava', name: 'Ostrava', type: 'real', desc: 'v3.5 | 1.2 GB' },
            { id: 'ostravahlucin', name: 'Ostrava - Hlučín', type: 'real', desc: 'v1.2 | 310 MB' },
            { id: 'csad', name: '3ČSAD', type: 'real', desc: 'v4.0 | 850 MB' },
            { id: 'rpaha', name: 'Rpaha', type: 'fic', desc: 'v1.0 | 520 MB' },
            { id: 'doznov', name: 'Doznov nad Opozenské králové', type: 'fic', desc: 'v2.3 | 640 MB' },
            { id: 'branik', name: 'Braník a okolí', type: 'fic', desc: 'v1.1 | 290 MB' }
        ];

        // Výchozí texty na nástěnkách (ukázka)
        const defaultPosts = [
            { id: 1, mapId: 'global', type: 'oznameni', title: 'Vítejte v dispečinku', text: 'Klikněte na jakoukoliv mapu vlevo pro zobrazení jejích specifických výluk a aktualit.', date: 'INFO' },
            { id: 2, mapId: 'opava15', type: 'vyluky', title: 'Uzavírka Kateřinky', text: 'Linky DPO jezdí odklonem přes zastávku Zimní stadion.', date: 'DNES' },
            { id: 3, mapId: 'rpaha', type: 'aktuality', title: 'Vydána verze Beta', text: 'Opraveny propady textur u hlavního nádraží.', date: 'VČERA' }
        ];

        let posts = JSON.parse(localStorage.getItem('busDashboardPosts')) || defaultPosts;
        let currentMapScope = 'global'; // 'global' nebo ID konkrétní mapy

        function validateLogin() {
            if (document.getElementById('username').value.trim() === "Petr Šmatlák" && document.getElementById('pin').value.trim() === "10345") {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('appInterface').style.display = 'block';
                initApp();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            document.getElementById('appInterface').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('pin').value = '';
        }

        function initApp() {
            renderMapsList();
            viewGlobalDashboard();
        }

        // Vykreslení seznamu map vlevo
        function renderMapsList() {
            const listContainer = document.getElementById('mapsList');
            listContainer.innerHTML = '';
            
            mapsData.forEach(map => {
                const card = document.createElement('div');
                card.className = `map-card ${currentMapScope === map.id ? 'active-card' : ''}`;
                if(currentMapScope === map.id) card.style.borderColor = 'var(--accent-color)';
                
                card.onclick = () => openMapDetail(map.id);
                
                card.innerHTML = `
                    <div class="map-details">
                        <h3>${map.name.split(' ')[0]} <span class="tag tag-${map.type}">${map.type === 'real' ? 'Reálná' : 'Fiktivní'}</span></h3>
                        <p>${map.desc}</p>
                    </div>
                    <button class="open-btn">Otevřít</button>
                `;
                listContainer.appendChild(card);
            });
        }

        // Zobrazení HLAVNÍ GLOBÁLNÍ nástěnky
        function viewGlobalDashboard() {
            currentMapScope = 'global';
            document.getElementById('adminTitle').innerText = "✍️ Přidat záznam na GLOBÁLNÍ nástěnku";
            
            const zone = document.getElementById('dynamicContentZone');
            zone.innerHTML = `
                <div class="section-title">Globální informační panely (Všechny mapy)</div>
                <div class="dashboard-panels">
                    <div><div style="color:var(--accent-color); font-weight:bold; margin-bottom:10px;">📢 OZNÁMENÍ</div><div class="feed-box" id="box-oznameni"></div></div>
                    <div><div style="color:var(--danger); font-weight:bold; margin-bottom:10px;">⚠️ VÝLUKY</div><div class="feed-box" id="box-vyluky"></div></div>
                    <div><div style="color:var(--warning); font-weight:bold; margin-bottom:10px;">📰 AKTUALITY</div><div class="feed-box" id="box-aktuality"></div></div>
                </div>
            `;
            renderPosts();
            renderMapsList();
        }

        // Zobrazení DETAILU MAPY po kliknutí
        function openMapDetail(mapId) {
            currentMapScope = mapId;
            const mapObj = mapsData.find(m => m.id === mapId);
            document.getElementById('adminTitle').innerText = `✍️ Přidat záznam pro mapu: ${mapObj.name.split(' ')[0]}`;

            const zone = document.getElementById('dynamicContentZone');
            zone.innerHTML = `
                <div class="map-detail-header">
                    <div>
                        <button class="back-btn" onclick="viewGlobalDashboard()">⬅ Zpět</button>
                        <span style="font-size: 1.3rem; font-weight: bold;">${mapObj.name}</span>
                    </div>
                    <button class="open-btn" style="background-color: var(--success);" onclick="alert('Stahování mapy: ${mapObj.name}')">⚡ Stáhnout aktualizaci</button>
                </div>
                
                <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px;">
                    Zobrazujete hlášení, výluky a aktuality svázané pouze s touto mapou.
                </div>

                <div class="dashboard-panels">
                    <div><div style="color:var(--accent-color); font-weight:bold; margin-bottom:10px;">📢 OZNÁMENÍ MAPY</div><div class="feed-box" id="box-oznameni"></div></div>
                    <div><div style="color:var(--danger); font-weight:bold; margin-bottom:10px;">⚠️ VÝLUKY MAPY</div><div class="feed-box" id="box-vyluky"></div></div>
                    <div><div style="color:var(--warning); font-weight:bold; margin-bottom:10px;">📰 AKTUALITY MAPY</div><div class="feed-box" id="box-aktuality"></div></div>
                </div>
            `;
            renderPosts();
            renderMapsList();
        }

        // Vykreslení příspěvků na základě aktuálního filtru (global vs konkrétní mapa)
        function renderPosts() {
            const bOznameni = document.getElementById('box-oznameni');
            const bVyluky = document.getElementById('box-vyluky');
            const bAktuality = document.getElementById('box-aktuality');
            
            if(!bOznameni) return;

            bOznameni.innerHTML = '';
            bVyluky.innerHTML = '';
            bAktuality.innerHTML = '';

            const filtered = posts.filter(p => p.mapId === currentMapScope);

            filtered.forEach(post => {
                const item = document.createElement('div');
                item.className = `feed-item type-${post.type}`;
                item.innerHTML = `
                    <span class="feed-date">${post.date}</span>
                    <h4>${post.title} <button class="delete-btn" onclick="deletePost(${post.id})">❌</button></h4>
                    <p>${post.text}</p>
                `;
                
                if (post.type === 'oznameni') bOznameni.appendChild(item);
                if (post.type === 'vyluky') bVyluky.appendChild(item);
                if (post.type === 'aktuality') bAktuality.appendChild(item);
            });
        }

        // Přidání příspěvku
        function addPost() {
            const type = document.getElementById('postType').value;
            const title = document.getElementById('postTitle').value.trim();
            const text = document.getElementById('postText').value.trim();
            let dateTag = document.getElementById('postDateTag').value.trim();

            if (!title || !text) {
                alert('Prosím vyplňte titulek a obsah zprávy.');
                return;
            }

            if (!dateTag) {
                const now = new Date();
                dateTag = `${now.getDate()}. ${now.getMonth() + 1}.`;
            }

            const newPost = {
                id: Date.now(),
                mapId: currentMapScope, // Uloží se buď pod 'global' nebo pod id mapy (např. 'opava15')
                type: type,
                title: title,
                text: text,
                date: dateTag.toUpperCase()
            };

            posts.unshift(newPost);
            localStorage.setItem('busDashboardPosts', JSON.stringify(posts));
            renderPosts();

            document.getElementById('postTitle').value = '';
            document.getElementById('postText').value = '';
            document.getElementById('postDateTag').value = '';
        }

        // Smazání příspěvku
        function deletePost(id) {
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('busDashboardPosts', JSON.stringify(posts));
            renderPosts();
        }
    </script>
</body>
</html>
